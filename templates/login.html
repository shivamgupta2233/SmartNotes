{% extends "base.html" %}

{% block content %}

<h2 class="text-center">Login</h2>

<form method="POST">

    <div class="mb-3">

        <label>Email</label>

        <input
            type="email"
            name="email"
            class="form-control"
            required>

    </div>

    <div class="mb-3">

        <label>Password</label>

        <input
            type="password"
            name="password"
            class="form-control"
            required>

    </div>

    <button class="btn btn-primary">

        Login

    </button>

</form>

<p class="mt-3">

    Don't have an account?

    <a href="{{ url_for('auth.register') }}">

        Register

    </a>

</p>

{% endblock %}
